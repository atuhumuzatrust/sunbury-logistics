<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Contact Us | Sunbury Logistics</title>

    <link rel="stylesheet" href="css/style.css">

    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&family=Playfair+Display:wght@600;700;800&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

</head>

<body>

<header id="header"></header>


<section class="page-banner">

    <div class="container">

        <p class="section-tag">WE ARE HERE TO HELP</p>

        <h1>Contact <span>Sunbury Logistics</span></h1>

        <p>Let's discuss your logistics requirements.</p>

    </div>

</section>


<section class="section-padding">

    <div class="container">

        <div class="section-heading">

            <p class="section-tag">GET IN TOUCH</p>

            <h2 class="section-title">
                We'd Love To <span>Hear From You</span>
            </h2>

        </div>


        <div class="contact-grid">


            <div class="contact-card">

                <i class="fas fa-location-dot"></i>

                <h3>Our Location</h3>

                <p>Nakawa, Kampala, Uganda</p>

            </div>


            <div class="contact-card">

                <i class="fas fa-phone"></i>

                <h3>Telephone</h3>

                <p id="contact-phone"></p>

            </div>


            <div class="contact-card">

                <i class="fas fa-envelope"></i>

                <h3>Email</h3>

                <p id="contact-email"></p>

            </div>


        </div>


        <div class="contact-actions">

            <a href="#" id="contact-whatsapp" class="btn whatsapp-btn">

                <i class="fab fa-whatsapp"></i>

                CHAT WITH US ON WHATSAPP

            </a>


            <a href="quote.html" class="btn btn-dark">

                REQUEST A QUOTE

            </a>

        </div>


        <div class="map-container">

            <iframe
                src="https://www.google.com/maps?q=Nakawa,Kampala,Uganda&output=embed"
                width="100%"
                height="400"
                style="border:0;"
                allowfullscreen=""
                loading="lazy">
            </iframe>

        </div>

    </div>

</section>


<footer id="footer"></footer>

<script src="js/script.js"></script>

</body>
</html>
