<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Track Shipment | Sunbury Logistics</title>

    <link rel="stylesheet" href="css/style.css">

    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&family=Playfair+Display:wght@600;700;800&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

</head>

<body>

<header id="header"></header>


<section class="page-banner banner-sea">

    <div class="container">

        <p class="section-tag">SHIPMENT INFORMATION</p>

        <h1>Track Your <span>Shipment</span></h1>

        <p>Stay informed about your cargo journey.</p>

    </div>

</section>


<section class="section-padding tracking-section">

    <div class="container tracking-box">

        <i class="fas fa-box-open tracking-main-icon"></i>

        <h2>Where Is Your Cargo?</h2>

        <p>

            Enter your shipment tracking reference
            to check its status.

        </p>


        <form id="tracking-form">

            <input
                type="text"
                id="tracking-number"
                placeholder="Enter tracking number"
                required
            >

            <button type="submit" class="btn btn-gold">
                TRACK SHIPMENT
            </button>

        </form>


        <div id="tracking-result"></div>

        <div class="tracking-note">

            <i class="fas fa-info-circle"></i>

            For shipment assistance, contact our customer
            support team.

        </div>

    </div>

</section>


<footer id="footer"></footer>

<script src="js/script.js"></script>

</body>
</html>
